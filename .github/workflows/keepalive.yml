# Keeps the free Supabase project from pausing (it pauses after ~7 days idle).
# Runs on GitHub's servers for free (public repo); no computer needs to be on.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 1 */2 * *"   # every 2 days, 08:17 Thai time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the public attendance endpoint
        run: |
          KEY=$(curl -fsS https://mario191k-maker.github.io/mwa-checkin/js/config.js | grep -oE 'eyJ[A-Za-z0-9._-]+' | head -1)
          for i in 1 2 3; do
            curl -fsS -X POST https://pjzxbctiteafmiomnkfj.supabase.co/functions/v1/checkin \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"mode":"ATTENDANCE_LIST"}' && exit 0
            sleep 20
          done
          exit 1
      # GitHub turns off scheduled workflows after 60 days without commits; a tiny monthly commit prevents that.
      - uses: actions/checkout@v4
      - name: Keep the repo active (1st-2nd of each month)
        run: |
          if [ "$(date -u +%d)" -le 2 ]; then
            date -u > .keepalive
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push || true
          fi
