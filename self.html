<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เช็คอิน / เช็คเอาท์ สัมมนา | สหกรณ์ออมทรัพย์พนักงาน กปน.</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { mwa: { navy: '#083AA9', blue: '#1363DF', sky: '#47B5FF', cyan: '#00B4D8', deep: '#003B93' } } } } };</script>
  <script src="js/config.js"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen">
  <main class="max-w-md mx-auto p-4 space-y-4">
    <header class="rounded-2xl bg-white shadow overflow-hidden">
      <div class="flex items-center gap-3 p-4">
        <img src="assets/logo.png" alt="ตราสหกรณ์" class="h-14 w-14 shrink-0" />
        <div class="leading-tight">
          <p class="text-sm font-bold text-mwa-navy">สหกรณ์ออมทรัพย์พนักงานการประปานครหลวง จำกัด</p>
          <p class="text-[10px] text-slate-500">Saving Cooperative Of Metropolitan Waterworks Authority Limited</p>
        </div>
      </div>
      <div id="hdr" class="bg-mwa-blue text-white text-center py-3">
        <h1 id="title" class="text-xl font-bold">เช็คอินเข้าสัมมนา</h1>
      </div>
    </header>

    <!-- Form -->
    <form id="form" class="bg-white rounded-2xl shadow p-5 space-y-4 hidden" novalidate>
      <p class="text-sm text-slate-600">กรุณากรอกข้อมูลให้ตรงกับที่ลงทะเบียนไว้กับสหกรณ์</p>
      <label class="block">
        <span class="text-sm font-semibold text-slate-700">เลขสมาชิก</span>
        <input id="member_no" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="เช่น 00001"
          class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-mwa-blue" />
      </label>
      <label class="block">
        <span class="text-sm font-semibold text-slate-700">ชื่อ-นามสกุล</span>
        <input id="full_name" autocomplete="off" maxlength="150" placeholder="เช่น สมชาย ใจดี"
          class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-mwa-blue" />
      </label>
      <p id="err" class="hidden text-sm rounded-xl bg-red-50 text-red-700 border border-red-200 p-3"></p>
      <button id="btn" type="submit"
        class="w-full rounded-xl py-3.5 text-lg font-bold text-white bg-mwa-blue hover:bg-mwa-navy disabled:opacity-50">ยืนยัน</button>
    </form>

    <!-- Result -->
    <section id="result" class="hidden bg-white rounded-2xl shadow p-6 text-center space-y-2"></section>

    <!-- Bad link -->
    <section id="badlink" class="hidden bg-white rounded-2xl shadow p-6 text-center space-y-2">
      <p class="text-4xl">📷</p>
      <p class="font-bold text-slate-800">กรุณาสแกน QR Code ที่หน้าจอ iPad ที่โต๊ะลงทะเบียน</p>
      <p class="text-sm text-slate-500">ลิงก์นี้ใช้ได้เฉพาะเมื่อสแกนจากหน้าจอโดยตรง</p>
    </section>
  </main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get("t") || "";
  var parts = token.split("|");
  var isOut = parts[0] === "SELF" && parts[1] === "OUT";
  var valid = parts[0] === "SELF" && (parts[1] === "IN" || parts[1] === "OUT");

  if (!valid) { $("badlink").classList.remove("hidden"); return; }

  if (isOut) {
    $("title").textContent = "เช็คเอาท์ออกจากสัมมนา";
    $("hdr").className = "bg-emerald-600 text-white text-center py-3";
    $("btn").className = "w-full rounded-xl py-3.5 text-lg font-bold text-white bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50";
  }
  $("form").classList.remove("hidden");

  function thaiTime(iso) {
    try { return new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "medium" }); }
    catch (_) { return iso || ""; }
  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = $("err"); err.classList.add("hidden");
    var memberNo = $("member_no").value.trim(), fullName = $("full_name").value.trim();
    if (!memberNo || !fullName) {
      err.textContent = "กรุณากรอกเลขสมาชิกและชื่อ-นามสกุล"; err.classList.remove("hidden"); return;
    }
    var btn = $("btn"); btn.disabled = true; btn.textContent = "กำลังตรวจสอบ...";
    try {
      var res = await window.invokeEdgeFunction("checkin", {
        mode: "SELF", action_type: isOut ? "CHECKOUT" : "CHECKIN",
        self_token: token, member_no: memberNo, full_name: fullName
      });
      var a = res.attendee || {};
      var already = res.already_checked_in || res.already_checked_out;
      var when = isOut ? a.checked_out_at : a.checked_in_at;
      $("form").classList.add("hidden");
      var box = $("result"); box.classList.remove("hidden");
      box.innerHTML =
        '<p class="text-5xl">' + (already ? "ℹ️" : "✅") + '</p>' +
        '<p class="text-xl font-bold ' + (already ? "text-amber-600" : "text-emerald-600") + '">' + esc(res.message) + '</p>' +
        '<p class="text-lg font-semibold text-slate-800">' + esc(a.full_name) + '</p>' +
        '<p class="text-sm text-slate-500">เลขสมาชิก ' + esc(a.member_no) + '</p>' +
        '<p class="text-sm text-slate-500">เวลา ' + esc(thaiTime(when)) + '</p>' +
        (res.note && !already
          ? '<p class="mt-3 text-base rounded-xl bg-blue-50 border border-blue-100 text-mwa-navy p-3 whitespace-pre-line">' + esc(res.note) + '</p>'
          : '');
    } catch (ex) {
      btn.disabled = false; btn.textContent = "ยืนยัน";
      if (ex.data && ex.data.not_registered) {
        // big, clear card instead of the small error line
        $("form").classList.add("hidden");
        var box = $("result"); box.classList.remove("hidden");
        box.innerHTML =
          '<p class="text-5xl">🚫</p>' +
          '<p class="text-xl font-bold text-rose-600 whitespace-pre-line">' + esc(ex.data.error || ex.message) + '</p>' +
          '<p class="text-sm text-slate-500">เลขสมาชิกที่กรอก: <strong>' + esc(memberNo) + '</strong></p>' +
          (ex.data.detail ? '<p class="text-sm text-slate-600 whitespace-pre-line">' + esc(ex.data.detail) + '</p>' : '') +
          '<button id="btnRetry" type="button" class="mt-3 w-full rounded-xl py-3 font-semibold border border-slate-300 text-slate-700">กรอกเลขสมาชิกใหม่</button>';
        $("btnRetry").addEventListener("click", function () {
          box.classList.add("hidden"); $("form").classList.remove("hidden"); $("member_no").focus();
        });
        return;
      }
      err.textContent = ex.message || "เกิดข้อผิดพลาด กรุณาลองใหม่หรือติดต่อเจ้าหน้าที่";
      err.classList.remove("hidden");
    }
  });
})();
</script>
</body>
</html>
